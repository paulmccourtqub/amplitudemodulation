<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amplitude Modulation Simulator</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 850px; }
        canvas { background: #fff; border: 1px solid #ddd; border-radius: 4px; display: block; margin: 10px 0; }
        .controls { display: flex; align-items: center; gap: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; }
        .label-group { display: flex; flex-direction: column; }
        input[type="range"] { width: 250px; }
        .stats { font-weight: bold; font-size: 1.1em; color: #d9534f; }
        h2 { margin-top: 0; color: #333; }
        .chart-label { font-size: 0.85em; font-weight: bold; color: #666; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Amplitude Modulation (AM) Visualizer</h2>
    
    <div class="controls">
        <div class="label-group">
            <label for="ampSlider">Message Amplitude ($A_m$):</label>
            <input type="range" id="ampSlider" min="0" max="100" step="1" value="50">
        </div>
        <div class="stats">
            Modulation Index ($m$): <span id="mVal">0.50</span>
        </div>
    </div>

    <div>
        <div class="chart-label">Information Signal (Message)</div>
        <canvas id="msgCanvas" width="800" height="200"></canvas>
        
        <div class="chart-label">Carrier Signal</div>
        <canvas id="carCanvas" width="800" height="120"></canvas>
        
        <div class="chart-label">AM Modulated Signal</div>
        <canvas id="modCanvas" width="800" height="300"></canvas>
    </div>
</div>

<script>
    const msgCanvas = document.getElementById('msgCanvas');
    const carCanvas = document.getElementById('carCanvas');
    const modCanvas = document.getElementById('modCanvas');
    const ampSlider = document.getElementById('ampSlider');
    const mValDisplay = document.getElementById('mVal');

    const mCtx = msgCanvas.getContext('2d');
    const cCtx = carCanvas.getContext('2d');
    const modCtx = modCanvas.getContext('2d');

    let t = 0;
    const Ac = 60;    // Carrier Amplitude (Fixed)
    const fc = 0.12;   // Carrier Frequency
    const fm = 0.01;  // Message Frequency

    function draw() {
        // Clear all
        mCtx.clearRect(0, 0, 800, 200);
        cCtx.clearRect(0, 0, 800, 120);
        modCtx.clearRect(0, 0, 800, 300);

        const Am = parseFloat(ampSlider.value);
        const m = (Am / Ac).toFixed(2);
        mValDisplay.innerText = m;

        // Draw Axes
        [mCtx, cCtx, modCtx].forEach(ctx => {
            ctx.beginPath();
            ctx.strokeStyle = '#eee';
            ctx.moveTo(0, ctx.canvas.height/2);
            ctx.lineTo(800, ctx.canvas.height/2);
            ctx.stroke();
        });

        const pMsg = new Path2D();
        const pCar = new Path2D();
        const pMod = new Path2D();
        const pEnv = new Path2D(); // Envelope line

        for (let x = 0; x < 800; x++) {
            const timeIdx = x + t;
            
            // 1. Message Signal: Am * cos(2pi * fm * t)
            const yMsg = Am * Math.cos(2 * Math.PI * fm * timeIdx);
            
            // 2. Carrier Signal: Ac * cos(2pi * fc * t)
            const yCar = Ac * Math.cos(2 * Math.PI * fc * timeIdx);
            
            // 3. AM Signal: [Ac + Am*cos(2pi*fm*t)] * cos(2pi*fc*t)
            const envelope = Ac + yMsg;
            const yMod = envelope * Math.cos(2 * Math.PI * fc * timeIdx);

            if (x === 0) {
                pMsg.moveTo(x, 100 - yMsg);
                pCar.moveTo(x, 60 - yCar);
                pMod.moveTo(x, 150 - yMod);
                pEnv.moveTo(x, 150 - envelope);
            } else {
                pMsg.lineTo(x, 100 - yMsg);
                pCar.lineTo(x, 60 - yCar);
                pMod.lineTo(x, 150 - yMod);
                pEnv.lineTo(x, 150 - envelope);
            }
        }

        // Render Message (Green)
        mCtx.strokeStyle = '#28a745';
        mCtx.lineWidth = 2;
        mCtx.stroke(pMsg);

        // Render Carrier (Blue)
        cCtx.strokeStyle = '#007bff';
        cCtx.lineWidth = 1;
        cCtx.stroke(pCar);

        // Render AM Signal (Black)
        modCtx.strokeStyle = '#333';
        modCtx.lineWidth = 1;
        modCtx.stroke(pMod);

        // Render Envelope (Dashed Red)
        modCtx.strokeStyle = 'rgba(217, 83, 79, 0.5)';
        modCtx.setLineDash([5, 5]);
        modCtx.stroke(pEnv);
        modCtx.setLineDash([]);

        t += 0.5; // Controls scrolling speed
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
